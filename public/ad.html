<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="./css/ad.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <h1>Admin Panel</h1>
       
    </header>
    <main>
        <div class="tabs-container">
            <button class="tab" onclick="showTab('menu-tab')">Menu Management</button>
            <button class="tab" onclick="showTab('chef-tab')">Chef Management</button>
        </div>

        <!-- Menu Management Section -->
        <div id="menu-tab" class="tab-content">
            <div class="section-header">
                <h2>Menu Management</h2>
                <button class="add-btn" onclick="openModal('menu-modal')">+ Add New Menu Item</button>
            </div>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Image</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="menu-list"></tbody>
            </table>
        </div>

        <!-- Chef Management Section -->
        <div id="chef-tab" class="tab-content" style="display: none;">
            <div class="section-header">
                <h2>Chef Management</h2>
                <button class="add-btn" onclick="openModal('chef-modal')">+ Add New Chef</button>
            </div>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Specialty</th>
                        <th>Image</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="chef-list"></tbody>
            </table>
        </div>

        <!-- Menu Modal -->
        <div id="menu-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('menu-modal')">&times;</span>
                <h2>Add/Edit Menu Item</h2>
                <form id="menu-form">
                    <input type="hidden" name="id">
                    <input type="text" name="name" placeholder="Enter Name" required>
                    <textarea name="description" placeholder="Enter Description" required></textarea>
                    <input type="number" name="price" placeholder="Enter Price" required>
                    <input type="file" name="image" accept="image/*">
                    <button type="submit" class="submit-btn">Save</button>
                </form>
            </div>
        </div>

        <!-- Chef Modal -->
        <div id="chef-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('chef-modal')">&times;</span>
                <h2>Add/Edit Chef</h2>
                <form id="chef-form">
                    <input type="hidden" name="id">
                    <input type="text" name="name" placeholder="Enter Name" required>
                    <input type="text" name="specialty" placeholder="Enter Specialty" required>
                    <input type="file" name="image" accept="image/*">
                    <button type="submit" class="submit-btn">Save</button>
                </form>
            </div>
        </div>
    </main>
    <script src="./js/ad.js"></script>
    <script>
        function logout() {
            window.location.href = 'index.html'; // Replace 'index.html' with your home page URL
        }
    </script>
<div>
<button class="llogout-btn" onclick="logout()">Logout</button>
</div>
</body>
</html>
