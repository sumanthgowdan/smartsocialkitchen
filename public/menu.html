<body>
  <header>
    <div class="navbar">
      <h1>Social Kitchen</h1>
      <nav>
        <ul>
          <li><a href="welcome-home.html">Home</a></li>
          <li><a href="#">Menu</a></li>

          <li><a href="about-us.html">About Us</a></li>

  <main>
    <h2>Tell Our Chef What You'd Like</h2>

<!-- Search Bar with Icon -->
<div class="search-bar">
  <div class="search-wrapper">
    <input
      type="text"
      id="search-bar"
      placeholder="Search for a menu item..."
      oninput="searchMenu(event)"
    />
    <i class="fas fa-search search-icon"></i> <!-- Font Awesome search icon -->
    <!-- <span class="search-icon">&#128269;</span> Unicode for search icon -->
  </div>
</div>




    <div id="menu-container" class="menu-container">
        


      
    </div>
  </main>


  <div id="order-summary">
    <h3>Selected Items:</h3>
    <ul id="selected-items"></ul>
    <p>Total Price: ₹<span id="total-price">0</span></p>
    <button id="proceed-btn" disabled>Proceed to Chef Selection</button>
  </div>
